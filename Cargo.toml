[package]
name = "voice-input"
version = "0.1.0"
edition = "2024"

[dependencies]
sherpa-onnx = "2.0.3"

[target."cfg(windows)".dependencies]
anyhow = "1.0.105"
arboard = "3.7.0"
cpal = "0.18.2"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.19.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
toml = "1.2.3"
tray-icon = "0.27"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
