[package]
name = "azarasi-voice"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/azarasi1226/azarasi-voice"

# Windows 専用のアプリなので、依存はすべて Windows 向けにだけ入れる
[target."cfg(windows)".dependencies]
# 音声認識エンジン（Parakeet を ONNX Runtime で CPU 実行）。ビルド時に ONNX Runtime 込みのビルド済みライブラリをダウンロードし、exe に静的リンクする
sherpa-onnx = "2.0.3"
# エラー処理（anyhow::Result と文脈付きのエラーメッセージ）
anyhow = "1.0.105"
# クリップボードの読み書き（貼り付けと、元の中身を戻すのに使う）
arboard = "3.7.0"
# マイク録音（Windows では WASAPI）
cpal = "0.18.2"
# 設定ファイル（config.toml）の読み書き
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"
# モデルのハッシュ値（SHA-256）の計算
sha2 = "0.11"
# 設定画面と初回セットアップ画面。GPU を使わないよう、CPU 描画（renderer-software）だけを有効にしている
# ライセンスは GPL-3.0 で利用（このプロジェクトも GPL-3.0）
slint = { version = "1.19.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-software",
  "compat-1-2",
] }
# タスクトレイのアイコンと右クリックメニュー
tray-icon = "0.27"
# Windows API。使う機能だけを有効にしている
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",                 # 録音の開始・終了の効果音（PlaySound）
  "Win32_Security",                    # CreateMutexW（二重起動防止）の引数の型
  "Win32_System_Console",              # --console でログ用のコンソールを開く
  "Win32_System_Registry",             # 自動起動の登録（HKCU\...\Run）
  "Win32_System_Threading",            # 二重起動防止、スレッド ID、バックグラウンド優先度
  "Win32_UI_Input_KeyboardAndMouse",   # Ctrl+V の送信、修飾キーの状態
  "Win32_UI_WindowsAndMessaging",      # キーボードフック、メッセージループ
] }
