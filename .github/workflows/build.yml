# Windows 用 exe をビルドする。ローカルと同じく Linux 上で cargo-xwin を使ってクロスコンパイルする。
# v* のタグを push すると、ビルドした exe を GitHub Release に添付する。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang / lld / llvm-rc
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cargo-xwin
            ~/.cargo/registry
            target
          key: xwin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: xwin-${{ runner.os }}-

      - name: Lint (rustfmt / clippy)
        run: mise run lint

      - name: Build
        run: mise run build

      - uses: actions/upload-artifact@v7
        with:
          name: azarasi-voice
          path: target/x86_64-pc-windows-msvc/release/azarasi-voice.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: azarasi-voice
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" azarasi-voice.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
