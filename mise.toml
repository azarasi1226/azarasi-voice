[tools]
rust = { version = "1.100.0", profile = "minimal", components = "clippy,rustfmt", targets = "x86_64-pc-windows-msvc" }
"cargo:cargo-xwin" = "0.24.1"

[env]
# Anthropic API キーなどは .env に書く（.gitignore 済み）
_.file = ".env"

[tasks.build]
description = "Windows 用 exe をビルド"
run = "cargo xwin build --release --target x86_64-pc-windows-msvc"

[tasks.check]
run = "cargo xwin check --target x86_64-pc-windows-msvc"

[tasks.fmt]
description = "コードを整形"
run = "cargo fmt"

[tasks.lint]
description = "整形のずれと clippy の警告をチェック（CI と同じ。警告もエラー扱い）"
run = [
  "cargo fmt --check",
  "cargo xwin clippy --release --target x86_64-pc-windows-msvc --all-targets -- -D warnings",
]

[tasks.deploy]
description = "ビルドして %LOCALAPPDATA%\\azarasi-voice に配置（モデルは初回起動時にアプリがダウンロードする）"
depends = ["build"]
run = '''
set -eu
dest="$(wslpath "$(cmd.exe /c 'echo %LOCALAPPDATA%' 2>/dev/null | tr -d '\r')")/azarasi-voice"
mkdir -p "$dest"
# 起動中の exe は上書きできないが名前変更はできるので、古い方を退避してから置く
rm -f "$dest"/azarasi-voice.old-*.exe 2>/dev/null || true  # 使用中のものは消えずに残る
if [ -f "$dest/azarasi-voice.exe" ]; then mv "$dest/azarasi-voice.exe" "$dest/azarasi-voice.old-$(date +%s).exe"; fi
cp target/x86_64-pc-windows-msvc/release/azarasi-voice.exe "$dest/"
echo "配置先: $dest"
'''
